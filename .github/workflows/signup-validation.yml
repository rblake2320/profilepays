name: Signup validation contract
on:
  push:
    paths: ['backend/src/auth/**', 'backend/src/support/**', 'backend/src/common/input-validation.ts', 'frontend/src/**', 'tests/signup-validation.cjs', 'tests/support-session.cjs', 'tests/workspace-contract.cjs', 'package-lock.json']
  pull_request:
jobs:
  signup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: node tests/signup-validation.cjs
      - run: node tests/workspace-contract.cjs
      - run: node tests/support-session.cjs
      - run: npm run build --workspace backend
      - run: npm run build --workspace frontend
